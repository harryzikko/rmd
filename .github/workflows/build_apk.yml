name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: mobile_flutter
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile_flutter
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HybridRemoteDesktop-Release-APK
          path: mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
