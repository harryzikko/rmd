name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Doctor
        run: flutter doctor -v

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        working-directory: mobile_flutter
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile_flutter
        run: |
          chmod +x android/gradlew
          flutter build apk --release -v 2>&1 | tee build.log

      - name: Save build failure log to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-log
          git add -f mobile_flutter/build.log
          git commit -m "ci: capture build failure log" || true
          git push origin ci-log --force || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HybridRemoteDesktop-Release-APK
          path: mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create ${{ github.ref_name }} mobile_flutter/build/app/outputs/flutter-apk/app-release.apk \
            --title "Hybrid Remote Desktop ${{ github.ref_name }}" \
            --notes "### Phiên bản di động Hybrid Remote Desktop (${{ github.ref_name }})
          - Điều khiển máy tính mượt mà qua Wi-Fi và 4G/5G không cần mở port.
          - Đồng bộ chuột trực tiếp tỉ lệ 1:1, không lệch toạ độ.
          - Bàn phím ảo PC, Trackpad và phím tắt chuyên dụng.
          
          **Cài đặt:** Tải file \`app-release.apk\` bên dưới về điện thoại Android và mở cài đặt." \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
