name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Doctor
        run: flutter doctor -v

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        working-directory: mobile_flutter
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile_flutter
        run: |
          chmod +x android/gradlew
          flutter build apk --release -v 2>&1 | tee build.log

      - name: Save build failure log to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-log
          git add -f mobile_flutter/build.log
          git commit -m "ci: capture build failure log" || true
          git push origin ci-log --force || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HybridRemoteDesktop-Release-APK
          path: mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Push to raw apk branch for direct download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp mobile_flutter/build/app/outputs/flutter-apk/app-release.apk /tmp/app-release.apk
          git branch -D apk 2>/dev/null || true
          git checkout --orphan apk
          git rm -rf . 2>/dev/null || true
          cp /tmp/app-release.apk ./app-release.apk
          git add app-release.apk
          git commit -m "release: pre-built Hybrid Remote Desktop Android APK" || true
          git push origin apk --force

      - name: Create or Update GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK_PATH="mobile_flutter/build/app/outputs/flutter-apk/app-release.apk"
          TAG="${{ github.ref_name }}"
          echo "Processing release for tag: $TAG with file: $APK_PATH"
          gh release upload "$TAG" "$APK_PATH" --clobber || \
          gh release create "$TAG" "$APK_PATH" \
            --title "Hybrid Remote Desktop $TAG" \
            --notes "Bản phát hành Hybrid Remote Desktop $TAG cho Android (Flutter Native)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
